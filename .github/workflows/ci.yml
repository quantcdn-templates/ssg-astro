# CI workflow for SSG template
# Validates that the template builds successfully with latest dependencies
#
# This workflow:
# 1. Runs npm install (generates fresh package-lock.json with latest versions)
# 2. Runs the build command
# 3. Validates the output directory exists
#
# Scheduled daily to catch breaking changes in dependencies early.
name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    # Run daily at midnight UTC to catch dependency issues early
    - cron: '0 0 * * *'
  workflow_dispatch:

# The build only reads the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          if [ -d "dist" ]; then
            echo "✓ Build output directory exists"
            ls -la dist/
          else
            echo "✗ Build output directory 'dist' not found"
            exit 1
          fi
